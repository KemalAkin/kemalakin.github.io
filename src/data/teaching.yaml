# Üsküdar University, Department of Forensic Science.
- id: forensic-physics
  title: Forensic Physics I–II
  role: Teaching assistant
  institution: Üsküdar University
  years: 2019–2021
  order: 1
  summary: >-
    Freshman physics (Physics 101 and 102) reworked around forensic applications. I ran all laboratory
    sessions and part of the theory classes, wrote exam and homework questions and graded them. When the
    course moved online during the pandemic I built my own simulations in Python and Excel for the forensic
    examples.
  topics:
    - Physics and measurement
    - Vectors; motion in one and three dimensions
    - Work, energy and momentum
    - Conservation laws and the ballistic pendulum
    - Harmonic motion and the simple pendulum
    - Introduction to ballistics
    - Reconstruction of traffic accidents
    - Bloodstain pattern analysis
    - The electromagnetic spectrum and optics

